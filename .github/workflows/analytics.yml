name: Team Alarm analytics snapshot
# Refreshes analytics/latest.md with the live user counts.
# Runs on every push to the sicily branch, by hand from the Actions tab, and daily once this file is on main.
on:
  push:
    branches: [sicily]
    paths-ignore: ['analytics/latest.md']
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash analytics/snapshot.sh
      - name: Commit if the numbers changed
        run: |
          git config user.name "analytics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/latest.md
          git diff --cached --quiet || (git commit -m "Update Team Alarm analytics snapshot" && git push)
